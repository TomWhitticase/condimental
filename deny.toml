# cargo-deny configuration — used for the LICENCE check only
# (`cargo deny check licenses`, .github/workflows/audit.yml). Advisories stay
# with `cargo audit` in the same workflow.
#
# CONDIMENTAL is GPL-3.0-only (LICENSE). Every licence below is one that code
# linked into a GPL-3.0 program may carry. Adding a licence here is a
# licensing decision, not a build fix: check it is GPL-3.0-compatible first
# (Apache-2.0 is compatible with GPLv3 but not GPLv2; MPL-2.0 is, by its
# section 3.3), and update THIRD_PARTY_NOTICES.md in the same change.

[licenses]
allow = [
    "GPL-3.0-only",
    "MIT",
    "Apache-2.0",
    "MPL-2.0",
    "Zlib",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-3.0",
    "Unlicense",
]
confidence-threshold = 0.9

[licenses.private]
# The workspace's own crates are `publish = false`; judge them by their
# `license` field like everything else rather than skipping them.
ignore = false
