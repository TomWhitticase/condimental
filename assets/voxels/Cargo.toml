# The voxel asset generator (UI_UX.md §2a).
#
# Deliberately lives *inside* assets/voxels/ rather than in a sibling crate
# directory, so the doc's proposed layout (palette.ron / generators/ /
# models/ / previews/) stays literally true: `generators/` is this crate's
# source, and everything the pipeline touches sits in one place.
[package]
name = "voxgen"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "voxgen"
path = "generators/main.rs"

# UI_UX.md §5's icon pipeline (see generators/icons.rs's module doc for why
# this is a second binary rather than folded into voxgen's own main.rs).
[[bin]]
name = "voxicons"
path = "generators/icons.rs"

[dependencies]
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Only used by voxicons, to post-process vengi-thumbnailer's opaque PNG
# renders into transparent, cropped icons (see generators/icons.rs) — a
# mainstream, stable crate, not a niche one, so it doesn't carry the same
# "training-data gap" risk ARCHITECTURE.md §0 flags for `gdext`.
image = { version = "0.25", default-features = false, features = ["png"] }
