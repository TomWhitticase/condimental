# The voxel asset generator (UI_UX.md §2a).
#
# Deliberately lives *inside* assets/voxels/ rather than in a sibling crate
# directory, so the doc's proposed layout (palette.ron / generators/ /
# models/ / previews/) stays literally true: `generators/` is this crate's
# source, and everything the pipeline touches sits in one place.
[package]
name = "voxgen"
version = "0.1.0"
edition = "2024"
publish = false

[[bin]]
name = "voxgen"
path = "generators/main.rs"

[dependencies]
ron = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
